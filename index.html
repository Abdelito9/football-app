<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Analyse football : matchs, arbitres, sélections, joueurs">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FootAnalyse</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    /* Inline critical: prevent flash of unstyled content */
    .na { color: var(--text-muted); font-style: italic; font-size: .9em; }
    .rating-high { color: var(--win) !important; }
    .rating-mid  { color: var(--accent) !important; }
    .rating-low  { color: var(--text-muted) !important; }
  </style>
</head>
<body>
  <div id="app">

    <!-- ── Top bar ─────────────────────────────────────── -->
    <header class="top-bar" id="topBar">
      <button class="back-btn hidden" id="backBtn" aria-label="Retour" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h1 class="app-title" id="pageTitle">FootAnalyse</h1>
      <div class="header-actions" id="headerActions"></div>
    </header>

    <!-- ── Main content ───────────────────────────────── -->
    <main class="main-content" id="mainContent">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Chargement…</p>
      </div>
    </main>

    <!-- ── Bottom navigation ──────────────────────────── -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Navigation principale">

      <a class="nav-item" href="#matches" data-page="matches" aria-label="Matchs">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
                   15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          <path d="M2 12h20"/>
        </svg>
        <span>Matchs</span>
      </a>

      <a class="nav-item" href="#clubs" data-page="clubs" aria-label="Clubs">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Clubs</span>
      </a>

      <a class="nav-item" href="#referees" data-page="referees" aria-label="Arbitres">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
          <line x1="12" y1="14" x2="12" y2="20"/>
        </svg>
        <span>Arbitres</span>
      </a>

      <a class="nav-item" href="#national" data-page="national" aria-label="Nations">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
                   15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span>Nations</span>
      </a>

      <a class="nav-item" href="#players" data-page="players" aria-label="Joueurs">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Joueurs</span>
      </a>

    </nav>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
